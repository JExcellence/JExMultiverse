prefix:
  - "<gradient:#ff7f50:#ff4500>Multiverse</gradient> <dark_gray>|</dark_gray> "

# Shared chrome fallbacks used by BaseView / PaginatedView when a specific view
# omits its own back/page key (see JExPlatform BaseView#i18nWithDefault). Without
# these the mv edit / gamerules GUIs render raw i18n keys as tile names.
_defaults:
  back: "<gradient:#ffa500:#ff6347>← Back</gradient>"
  page:
    name: "<gradient:#ff7f50:#ff4500>Page {current}</gradient> <dark_gray>/</dark_gray> <gradient:#ffa500:#ff6347>{total}</gradient>"
    lore:
      - "<gray>Left-click: previous page</gray>"
      - "<gray>Right-click: next page</gray>"

multiverse:
  invalid_environment: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Unknown environment <gradient:#ff7f50:#ff4500>{environment}</gradient>. Use NORMAL, NETHER, or THE_END.</white>"
  invalid_type: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Unknown world type <gradient:#ff7f50:#ff4500>{type}</gradient>. Use DEFAULT, VOID, or PLOT.</white>"
  type_not_available: "<gradient:#dc143c:#b22222>Error:</gradient> <white>World type <gradient:#ff7f50:#ff4500>{type}</gradient> is not available in this edition.</white>"
  type_not_supported_on_platform: "<gradient:#dc143c:#b22222>Error:</gradient> <white>World type <gradient:#ff7f50:#ff4500>{type}</gradient> cannot be created on Folia. Folia builds worlds through the NMS loader, which has no generator support, so the world would generate as void. Use DEFAULT or VOID instead.</white>"
  world_limit_reached: "<gradient:#dc143c:#b22222>Limit Reached:</gradient> <white>You have reached the maximum world limit (<gradient:#ff7f50:#ff4500>{max}</gradient>).</white>"
  world_does_not_exist: "<gradient:#dc143c:#b22222>Error:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> does not exist.</white>"
  world_already_exists: "<gradient:#dc143c:#b22222>Error:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> already exists.</white>"

  # ── Build-lock / build mode ──
  lock_success: "<gradient:#32cd32:#228b22>Locked:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> is now build-locked. <gray>Only operators and /mv build can act here.</gray></white>"
  unlock_success: "<gradient:#32cd32:#228b22>Unlocked:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> is no longer build-locked.</white>"
  lock_already: "<gradient:#ffa500:#ff8c00>Note:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> is already build-locked.</white>"
  unlock_already: "<gradient:#ffa500:#ff8c00>Note:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> is not build-locked.</white>"
  lock_failed: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Could not update the build-lock for <gradient:#ff7f50:#ff4500>{world_name}</gradient>.</white>"
  lock_not_managed: "<gradient:#dc143c:#b22222>Error:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> is not a managed multiverse world.</white>"
  lock_needs_world: "<gradient:#dc143c:#b22222>Error:</gradient> <white>From the console you must name a world: <gradient:#ff7f50:#ff4500>/mv lock <world></gradient>.</white>"
  build_enabled: "<gradient:#32cd32:#228b22>Build mode ON:</gradient> <white>You can now build in build-locked worlds. <gray>It resets when you log out.</gray></white>"
  build_disabled: "<gradient:#ffa500:#ff8c00>Build mode OFF:</gradient> <white>You no longer bypass build-locked worlds.</white>"
  world_locked_denied: "<gradient:#dc143c:#b22222>Locked:</gradient> <white>This world is build-locked. Use <gradient:#ff7f50:#ff4500>/mv build</gradient> if you're staff.</white>"

  creating_world: "<gradient:#ffa500:#ff8c00>Creating:</gradient> <white>Creating world <gradient:#ff7f50:#ff4500>{world_name}</gradient>...</white>"
  create_success: "<gradient:#32cd32:#228b22>Created:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> created. <gray>(type: {type}, env: {environment})</gray></white>"
  create_failed: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Failed to create world <gradient:#ff7f50:#ff4500>{world_name}</gradient>.</white>"
  import_already_managed: "<gradient:#ffa500:#ff8c00>Note:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> is already managed.</white>"
  import_folder_not_found: "<gradient:#dc143c:#b22222>Error:</gradient> <white>No world folder <gradient:#ff7f50:#ff4500>{world_name}</gradient> found on disk. Use /mv create for a new world.</white>"
  import_importing: "<gradient:#ffa500:#ff8c00>Importing:</gradient> <white>Registering existing world <gradient:#ff7f50:#ff4500>{world_name}</gradient>...</white>"
  import_success: "<gradient:#32cd32:#228b22>Imported:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> registered. <gray>(type: {type}, env: {environment})</gray></white>"
  import_failed: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Failed to import world <gradient:#ff7f50:#ff4500>{world_name}</gradient>.</white>"

  deleting_world: "<gradient:#ffa500:#ff8c00>Deleting:</gradient> <white>Deleting world <gradient:#ff7f50:#ff4500>{world_name}</gradient>...</white>"
  delete_success: "<gradient:#32cd32:#228b22>Deleted:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> has been deleted.</white>"
  delete_failed: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Failed to delete world <gradient:#ff7f50:#ff4500>{world_name}</gradient>.</white>"

  teleporting: "<gradient:#ffa500:#ff8c00>Teleporting:</gradient> <white>Teleporting to <gradient:#ff7f50:#ff4500>{world_name}</gradient>...</white>"
  teleported: "<gradient:#32cd32:#228b22>Teleported:</gradient> <white>You are now in <gradient:#ff7f50:#ff4500>{world_name}</gradient>.</white>"
  world_not_loaded: "<gradient:#dc143c:#b22222>Error:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> is not loaded.</white>"

  already_loaded: "<gradient:#ffa500:#ff8c00>Info:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> is already loaded.</white>"
  loading_world: "<gradient:#ffa500:#ff8c00>Loading:</gradient> <white>Loading world <gradient:#ff7f50:#ff4500>{world_name}</gradient>...</white>"
  load_success: "<gradient:#32cd32:#228b22>Loaded:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> loaded.</white>"
  load_failed: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Failed to load world <gradient:#ff7f50:#ff4500>{world_name}</gradient>.</white>"
  unload:
    not_loaded: "<gradient:#ffa500:#ff8c00>Info:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> is not loaded.</white>"
    success: "<gradient:#32cd32:#228b22>Unloaded:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> unloaded. Its files and settings are untouched.</white>"
    failed: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Failed to unload world <gradient:#ff7f50:#ff4500>{world_name}</gradient>.</white>"
  reset:
    confirm_required: "<gradient:#dc143c:#b22222>Careful:</gradient> <white>Resetting <gradient:#ff7f50:#ff4500>{world_name}</gradient> destroys every block in it. Settings and plots-per-world config survive, terrain does not. Run <gradient:#ffa500:#ff8c00>/mv reset {world_name} confirm</gradient> to proceed.</white>"
    started: "<gradient:#ffa500:#ff8c00>Resetting:</gradient> <white>Regenerating <gradient:#ff7f50:#ff4500>{world_name}</gradient>. Players in that world are being moved to spawn.</white>"
    completed: "<gradient:#32cd32:#228b22>Reset:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> has been regenerated.</white>"
    failed: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Failed to reset world <gradient:#ff7f50:#ff4500>{world_name}</gradient>. Check the console.</white>"
  clone:
    started: "<gradient:#ffa500:#ff8c00>Cloning:</gradient> <white>Copying <gradient:#ff7f50:#ff4500>{source}</gradient> to <gradient:#ff7f50:#ff4500>{target}</gradient>. Large worlds take a moment.</white>"
    completed: "<gradient:#32cd32:#228b22>Cloned:</gradient> <white>Copied <gradient:#ff7f50:#ff4500>{source}</gradient> to <gradient:#ff7f50:#ff4500>{target}</gradient>.</white>"
    failed: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Failed to clone <gradient:#ff7f50:#ff4500>{source}</gradient> to <gradient:#ff7f50:#ff4500>{target}</gradient>. Check the console.</white>"
    target_exists: "<gradient:#dc143c:#b22222>Error:</gradient> <white>A world named <gradient:#ff7f50:#ff4500>{target}</gradient> already exists.</white>"
    plots_not_copied: "<gradient:#ffa500:#ff8c00>Note:</gradient> <white>Plot claims were not copied - <gradient:#ff7f50:#ff4500>{target}</gradient> starts unclaimed.</white>"

  list_empty: "<gray>No managed worlds found.</gray>"
  list_header: "<gradient:#ff7f50:#ff4500>Managed Worlds</gradient> <dark_gray>({count})</dark_gray>"
  list_entry: " <gray>-</gray> <gradient:#ffa500:#ff6347>{world_name}</gradient> <dark_gray>[{type} / {environment}]</dark_gray> <gray>{status}</gray> <dark_gray>global:</dark_gray> <gray>{global_spawn}</gray>"
  list_footer: "<dark_gray>{count}/{max} worlds</dark_gray>"

  help_header: "<gradient:#ff7f50:#ff4500>Multiverse Commands</gradient>"
  help_create: "<gradient:#ffa500:#ff6347>/{alias} create <name> [env] [type]</gradient> <gray>- Create a new world</gray>"
  help_delete: "<gradient:#ffa500:#ff6347>/{alias} delete <world></gradient> <gray>- Delete a world</gray>"
  help_edit: "<gradient:#ffa500:#ff6347>/{alias} edit <world></gradient> <gray>- Edit world settings</gray>"
  help_teleport: "<gradient:#ffa500:#ff6347>/{alias} teleport <world></gradient> <gray>- Teleport to a world</gray>"
  help_load: "<gradient:#ffa500:#ff6347>/{alias} load <world></gradient> <gray>- Load a world from the database</gray>"
  help_unload: "<gradient:#ffa500:#ff6347>/{alias} unload <world> [save]</gradient> <gray>- Unload a world without deleting it</gray>"
  help_reset: "<gradient:#ffa500:#ff6347>/{alias} reset <world> confirm</gradient> <gray>- Regenerate terrain, keep settings</gray>"
  help_clone: "<gradient:#ffa500:#ff6347>/{alias} clone <world> <target></gradient> <gray>- Copy a world under a new name</gray>"
  help_list: "<gradient:#ffa500:#ff6347>/{alias} list</gradient> <gray>- List all managed worlds</gray>"
  help_footer: "<dark_gray>───────────────────────────────</dark_gray>"

  applyschematic_not_plot: "<gradient:#dc143c:#b22222>Error:</gradient> <white><gradient:#ff7f50:#ff4500>{world_name}</gradient> is not a PLOT world.</white>"
  applyschematic_missing_name: "<gradient:#dc143c:#b22222>Error:</gradient> <white><gradient:#ff7f50:#ff4500>{world_name}</gradient> has no schematic configured. Pass one as the second argument.</white>"
  applyschematic_not_found: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Schematic <gradient:#ff7f50:#ff4500>{schematic}</gradient> not found in plugins/JExMultiverse/schematics/.</white>"
  applyschematic_done: "<gradient:#32cd32:#228b22>Applied:</gradient> <white>Pasted <gradient:#ff7f50:#ff4500>{schematic}</gradient> at <gradient:#ff7f50:#ff4500>{count}</gradient> plot(s) in <gradient:#ff7f50:#ff4500>{world_name}</gradient> ({chunks} chunks scanned).</white>"
  applyschematic_done_single: "<gradient:#32cd32:#228b22>Applied:</gradient> <white>Pasted <gradient:#ff7f50:#ff4500>{schematic}</gradient> once at spawn <gradient:#ff7f50:#ff4500>{x}/{y}/{z}</gradient> in <gradient:#ff7f50:#ff4500>{world_name}</gradient>.</white>"
  paste_player_only: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Only players can paste schematics.</white>"
  paste_started: "<gradient:#ffa500:#ff8c00>Placing:</gradient> <white>Pasting <gradient:#ff7f50:#ff4500>{schematic}</gradient> - this may take a moment…</white>"
  paste_done: "<gradient:#32cd32:#228b22>Pasted:</gradient> <white><gradient:#ff7f50:#ff4500>{schematic}</gradient> ({width}x{height}x{length}) at <gradient:#ff7f50:#ff4500>{x}, {y}, {z}</gradient> in <gradient:#ff7f50:#ff4500>{world_name}</gradient>.</white>"
  paste_spawn_set: "<gradient:#32cd32:#228b22>Spawn:</gradient> <white>Set the spawn of <gradient:#ff7f50:#ff4500>{world_name}</gradient> to the paste point.</white>"
  edit:
    wand_given: "<gradient:#32cd32:#228b22>Wand:</gradient> <white>Left-click a block = corner 1, right-click = corner 2.</white>"
    pos1_set: "<gradient:#32cd32:#228b22>Corner 1:</gradient> <white><gradient:#ff7f50:#ff4500>{x}, {y}, {z}</gradient> <gray>({count} blocks selected)</gray></white>"
    pos2_set: "<gradient:#32cd32:#228b22>Corner 2:</gradient> <white><gradient:#ff7f50:#ff4500>{x}, {y}, {z}</gradient> <gray>({count} blocks selected)</gray></white>"
    no_selection: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Set both corners first - <gradient:#ff7f50:#ff4500>/mv wand</gradient> or <gradient:#ff7f50:#ff4500>/mv pos1</gradient> & <gradient:#ff7f50:#ff4500>/mv pos2</gradient>.</white>"
    wrong_world: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Your selection is in a different world.</white>"
    no_clipboard: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Your clipboard is empty - run <gradient:#ff7f50:#ff4500>/mv copy</gradient> first.</white>"
    working: "<gradient:#ffd700:#ffa500>Working:</gradient> <white>Processing <gradient:#ff7f50:#ff4500>{count}</gradient> blocks…</white>"
    selection_shown: "<gradient:#2dd4bf:#a855f7>Selection outline:</gradient> <white>shown - the particle box traces your pos1↔pos2 region.</white>"
    selection_hidden: "<gradient:#2dd4bf:#a855f7>Selection outline:</gradient> <white>hidden.</white>"
    set_done: "<gradient:#32cd32:#228b22>Filled:</gradient> <white><gradient:#ff7f50:#ff4500>{count}</gradient> blocks set to <gradient:#ff7f50:#ff4500>{material}</gradient>.</white>"
    bad_material: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Unknown block <gradient:#ff7f50:#ff4500>{material}</gradient>.</white>"
    copy_done: "<gradient:#32cd32:#228b22>Copied:</gradient> <white><gradient:#ff7f50:#ff4500>{count}</gradient> blocks to your clipboard.</white>"
    cut_done: "<gradient:#32cd32:#228b22>Cut:</gradient> <white><gradient:#ff7f50:#ff4500>{count}</gradient> blocks moved to your clipboard.</white>"
    paste_done: "<gradient:#32cd32:#228b22>Pasted:</gradient> <white>Clipboard (<gradient:#ff7f50:#ff4500>{width}x{height}x{length}</gradient>) at <gradient:#ff7f50:#ff4500>{x}, {y}, {z}</gradient>.</white>"
    save_done: "<gradient:#32cd32:#228b22>Saved:</gradient> <white><gradient:#ff7f50:#ff4500>{schematic}</gradient> <gray>({count} blocks)</gray> → plugins/JExMultiverse/schematics/.</white>"
    save_failed: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Could not save <gradient:#ff7f50:#ff4500>{schematic}</gradient> - see console.</white>"
    save_progress: "<gradient:#2DD4BF:#6366F1>Saving</gradient> <white><gradient:#ff7f50:#ff4500>{schematic}</gradient></white> <dark_gray>»</dark_gray> <#67E8F9>{percent}%</#67E8F9>"
    rotate_done: "<gradient:#32cd32:#228b22>Rotated:</gradient> <white>Clipboard turned <gradient:#ff7f50:#ff4500>{degrees}°</gradient> clockwise.</white>"
    rotate_bad_arg: "<gradient:#dc143c:#b22222>Error:</gradient> <white>Use <gradient:#ff7f50:#ff4500>90</gradient>, <gradient:#ff7f50:#ff4500>180</gradient> or <gradient:#ff7f50:#ff4500>270</gradient>.</white>"
    flip_done: "<gradient:#32cd32:#228b22>Flipped:</gradient> <white>Clipboard mirrored across the <gradient:#ff7f50:#ff4500>{axis}</gradient> axis.</white>"
    undo_done: "<gradient:#32cd32:#228b22>Undone:</gradient> <white>Restored the region from your last paste.</white>"
    undo_skipped: "<gradient:#f59e0b:#d97706>Heads up:</gradient> <white>Selection is too large ({count} blocks) - skipping undo snapshot; /mv undo will NOT restore this action.</white>"
    undo_empty: "<gradient:#dc143c:#b22222>Nothing:</gradient> <white>No paste to undo.</white>"

multiverse_editor_ui:
  title: "<gradient:#ff7f50:#ff4500>Edit World</gradient> <dark_gray>({world_name})</dark_gray>"
  info:
    name: "<gradient:#ff7f50:#ff4500>{world_name}</gradient>"
    lore:
      - ""
      - "<gray>Type:</gray> <gradient:#ffa500:#ff6347>{type}</gradient>"
      - "<gray>Environment:</gray> <gradient:#ffa500:#ff6347>{environment}</gradient>"
      - "<gray>Loaded:</gray> <gradient:#ffa500:#ff6347>{loaded}</gradient>"
      - "<gray>Managed gamerules:</gray> <gradient:#ffa500:#ff6347>{game_rules}</gradient>"
      - ""
      - "<gray>Changes are staged until you press Save.</gray>"
      - "<gray>Global spawn is the exception - it</gray>"
      - "<gray>applies immediately.</gray>"
  keep_spawn:
    name: "<gradient:#ff7f50:#ff4500>Keep Spawn Loaded</gradient> <dark_gray>({value})</dark_gray>"
    lore:
      - ""
      - "<gray>Status:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Holds the spawn chunks in memory.</gray>"
      - "<gray>Costs RAM - only worth it for worlds</gray>"
      - "<gray>with redstone or farms at spawn.</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Click</gradient> <gray>to toggle</gray>"
    toggled: "<gradient:#32cd32:#228b22>Keep Spawn:</gradient> <white>Spawn chunks in <gradient:#ff7f50:#ff4500>{world_name}</gradient> are now <gradient:#ffa500:#ff6347>{value}</gradient>.</white>"
  time_lock:
    name: "<gradient:#ff7f50:#ff4500>Pin Time</gradient> <dark_gray>({value})</dark_gray>"
    lore:
      - ""
      - "<gray>Pinned to:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Freezes the clock at the current time and</gray>"
      - "<gray>keeps it there across restarts. Also</gray>"
      - "<gray>disables the daylight cycle.</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Click</gradient> <gray>to pin or release</gray>"
    toggled: "<gradient:#32cd32:#228b22>Time Pin:</gradient> <white>Time in <gradient:#ff7f50:#ff4500>{world_name}</gradient> is now <gradient:#ffa500:#ff6347>{value}</gradient>.</white>"
  weather_lock:
    name: "<gradient:#ff7f50:#ff4500>Pin Weather</gradient> <dark_gray>({value})</dark_gray>"
    lore:
      - ""
      - "<gray>Pinned to:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Holds the current weather and keeps it</gray>"
      - "<gray>across restarts. Also disables the</gray>"
      - "<gray>weather cycle.</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Click</gradient> <gray>to pin or release</gray>"
    toggled: "<gradient:#32cd32:#228b22>Weather Pin:</gradient> <white>Weather in <gradient:#ff7f50:#ff4500>{world_name}</gradient> is now <gradient:#ffa500:#ff6347>{value}</gradient>.</white>"
  game_rules:
    name: "<gradient:#ff7f50:#ff4500>Gamerules</gradient> <dark_gray>({value} managed)</dark_gray>"
    lore:
      - ""
      - "<gray>Managed:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Per-world gamerules, re-applied every</gray>"
      - "<gray>time the world loads.</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Click</gradient> <gray>to open</gray>"
  not_loaded: "<gradient:#dc143c:#b22222>Error:</gradient> <white>World <gradient:#ff7f50:#ff4500>{world_name}</gradient> is not loaded, so live settings cannot be changed.</white>"
  spawn:
    name: "<gradient:#ff7f50:#ff4500>Set Spawn Point</gradient>"
    lore:
      - ""
      - "<gray>Current:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Click</gradient> <gray>to set spawn to your location</gray>"
    updated: "<gradient:#32cd32:#228b22>Spawn Updated:</gradient> <white>Spawn for <gradient:#ff7f50:#ff4500>{world_name}</gradient> set to your location.</white>"
    wrong_world: "<gradient:#dc143c:#b22222>Error:</gradient> <white>You must be in <gradient:#ff7f50:#ff4500>{world_name}</gradient> to set its spawn point.</white>"
  global_spawn:
    name: "<gradient:#ff7f50:#ff4500>Global Spawn</gradient> <dark_gray>({value})</dark_gray>"
    lore:
      - ""
      - "<gray>Status:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>When enabled, all players will</gray>"
      - "<gray>spawn in this world.</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Click</gradient> <gray>to toggle</gray>"
    toggled: "<gradient:#32cd32:#228b22>Global Spawn:</gradient> <white><gradient:#ff7f50:#ff4500>{world_name}</gradient> is now <gradient:#ffa500:#ff6347>{value}</gradient>.</white>"
    replaced: "<gradient:#ffa500:#ff8c00>Global Spawn:</gradient> <white>Replaced previous global spawn (<gradient:#ff7f50:#ff4500>{previous}</gradient>) with <gradient:#ff7f50:#ff4500>{world_name}</gradient>.</white>"
  pvp:
    name: "<gradient:#ff7f50:#ff4500>PvP Toggle</gradient> <dark_gray>({value})</dark_gray>"
    lore:
      - ""
      - "<gray>Status:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Controls whether players can</gray>"
      - "<gray>fight each other in this world.</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Click</gradient> <gray>to toggle</gray>"
    toggled: "<gradient:#32cd32:#228b22>PvP:</gradient> <white>PvP in <gradient:#ff7f50:#ff4500>{world_name}</gradient> is now <gradient:#ffa500:#ff6347>{value}</gradient>.</white>"
  time:
    name: "<gradient:#ff7f50:#ff4500>Time of Day</gradient> <dark_gray>({value})</dark_gray>"
    lore:
      - ""
      - "<gray>Current:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Cycles morning, noon, evening, night.</gray>"
      - "<gray>Use Pin Time to keep it across restarts.</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Click</gradient> <gray>to advance</gray>"
    updated: "<gradient:#32cd32:#228b22>Time:</gradient> <white>Time in <gradient:#ff7f50:#ff4500>{world_name}</gradient> set to <gradient:#ffa500:#ff6347>{value}</gradient>.</white>"
  weather:
    name: "<gradient:#ff7f50:#ff4500>Weather</gradient> <dark_gray>({value})</dark_gray>"
    lore:
      - ""
      - "<gray>Current:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Cycles clear, rain, storm.</gray>"
      - "<gray>Use Pin Weather to keep it across restarts.</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Click</gradient> <gray>to advance</gray>"
    updated: "<gradient:#32cd32:#228b22>Weather:</gradient> <white>Weather in <gradient:#ff7f50:#ff4500>{world_name}</gradient> set to <gradient:#ffa500:#ff6347>{value}</gradient>.</white>"
  difficulty:
    name: "<gradient:#ff7f50:#ff4500>Difficulty</gradient> <dark_gray>({value})</dark_gray>"
    lore:
      - ""
      - "<gray>Current:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Cycles peaceful, easy, normal, hard,</gray>"
      - "<gray>then unmanaged (server default).</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Click</gradient> <gray>to advance</gray>"
    updated: "<gradient:#32cd32:#228b22>Difficulty:</gradient> <white>Difficulty in <gradient:#ff7f50:#ff4500>{world_name}</gradient> set to <gradient:#ffa500:#ff6347>{value}</gradient>.</white>"
  build_lock:
    name: "<gradient:#ff7f50:#ff4500>Build Lock</gradient> <dark_gray>({value})</dark_gray>"
    lore:
      - ""
      - "<gray>Status:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Blocks building unless staff uses /mv build.</gray>"
      - "<gray>Save to persist this setting.</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Click</gradient> <gray>to toggle</gray>"
    toggled: "<gradient:#32cd32:#228b22>Build Lock:</gradient> <white><gradient:#ff7f50:#ff4500>{world_name}</gradient> is now <gradient:#ffa500:#ff6347>{value}</gradient>.</white>"
  interactions:
    name: "<gradient:#ff7f50:#ff4500>Locked Interactions</gradient> <dark_gray>({value})</dark_gray>"
    lore:
