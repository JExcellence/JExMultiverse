# ── JExCommand framework keys (parse errors, usage, permission denials) ─────
jexcommand:
  usage: "<gradient:#ff7f50:#ff4500>Usage:</gradient> <white>{usage}</white>"
  error:
    missing-argument: "<gradient:#dc143c:#b22222>Missing argument:</gradient> <gold>{name}</gold> <dark_gray>(<gray>{type}</gray>)</dark_gray>"
