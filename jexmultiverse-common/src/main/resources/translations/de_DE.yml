prefix:
  - "<gradient:#ff7f50:#ff4500>Multiverse</gradient> <dark_gray>|</dark_gray> "

# Shared chrome-Fallbacks für BaseView / PaginatedView, wenn eine View ihre
# eigenen back/page-Keys weglässt. Ohne diese rendern die mv edit / gamerules
# GUIs die rohen i18n-Keys statt der Tile-Namen.
_defaults:
  back: "<gradient:#ffa500:#ff6347>← Zurück</gradient>"
  page:
    name: "<gradient:#ff7f50:#ff4500>Seite {current}</gradient> <dark_gray>/</dark_gray> <gradient:#ffa500:#ff6347>{total}</gradient>"
    lore:
      - "<gray>Linksklick: vorherige Seite</gray>"
      - "<gray>Rechtsklick: nächste Seite</gray>"

multiverse:
  invalid_environment: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Unbekannte Umgebung <gradient:#ff7f50:#ff4500>{environment}</gradient>. Erlaubt: NORMAL, NETHER, THE_END.</white>"
  invalid_type: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Unbekannter Welttyp <gradient:#ff7f50:#ff4500>{type}</gradient>. Erlaubt: DEFAULT, VOID, PLOT.</white>"
  type_not_available: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welttyp <gradient:#ff7f50:#ff4500>{type}</gradient> ist in dieser Edition nicht verfügbar.</white>"
  type_not_supported_on_platform: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welttyp <gradient:#ff7f50:#ff4500>{type}</gradient> kann auf Folia nicht erstellt werden. Folia erzeugt Welten über den NMS-Loader, der keine Generatoren unterstützt - die Welt würde als Void generiert werden. Nutze stattdessen DEFAULT oder VOID.</white>"
  world_limit_reached: "<gradient:#dc143c:#b22222>Limit erreicht:</gradient> <white>Maximale Welt-Anzahl erreicht (<gradient:#ff7f50:#ff4500>{max}</gradient>).</white>"
  world_does_not_exist: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> existiert nicht.</white>"
  world_already_exists: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> existiert bereits.</white>"

  # ── Build-Sperre / Baumodus ──
  lock_success: "<gradient:#32cd32:#228b22>Gesperrt:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist jetzt build-gesperrt. <gray>Nur Operatoren und /mv build können hier agieren.</gray></white>"
  unlock_success: "<gradient:#32cd32:#228b22>Entsperrt:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist nicht mehr build-gesperrt.</white>"
  lock_already: "<gradient:#ffa500:#ff8c00>Hinweis:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist bereits build-gesperrt.</white>"
  unlock_already: "<gradient:#ffa500:#ff8c00>Hinweis:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist nicht build-gesperrt.</white>"
  lock_failed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Die Build-Sperre für <gradient:#ff7f50:#ff4500>{world_name}</gradient> konnte nicht geändert werden.</white>"
  lock_not_managed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist keine verwaltete Multiverse-Welt.</white>"
  lock_needs_world: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Von der Konsole musst du eine Welt angeben: <gradient:#ff7f50:#ff4500>/mv lock <welt></gradient>.</white>"
  build_enabled: "<gradient:#32cd32:#228b22>Baumodus AN:</gradient> <white>Du kannst jetzt in build-gesperrten Welten bauen. <gray>Setzt sich beim Abmelden zurück.</gray></white>"
  build_disabled: "<gradient:#ffa500:#ff8c00>Baumodus AUS:</gradient> <white>Du umgehst build-gesperrte Welten nicht mehr.</white>"
  world_locked_denied: "<gradient:#dc143c:#b22222>Gesperrt:</gradient> <white>Diese Welt ist build-gesperrt. Nutze <gradient:#ff7f50:#ff4500>/mv build</gradient>, falls du im Team bist.</white>"

  creating_world: "<gradient:#ffa500:#ff8c00>Erstelle:</gradient> <white>Erstelle Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient>...</white>"
  create_success: "<gradient:#32cd32:#228b22>Erstellt:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> erstellt. <gray>(Typ: {type}, Env: {environment})</gray></white>"
  create_failed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> konnte nicht erstellt werden.</white>"
  import_already_managed: "<gradient:#ffa500:#ff8c00>Hinweis:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> wird bereits verwaltet.</white>"
  import_folder_not_found: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Kein Weltordner <gradient:#ff7f50:#ff4500>{world_name}</gradient> auf der Platte gefunden. Nutze /mv create für eine neue Welt.</white>"
  import_importing: "<gradient:#ffa500:#ff8c00>Importiere:</gradient> <white>Registriere existierende Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient>...</white>"
  import_success: "<gradient:#32cd32:#228b22>Importiert:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> registriert. <gray>(Typ: {type}, Umgebung: {environment})</gray></white>"
  import_failed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> konnte nicht importiert werden.</white>"

  deleting_world: "<gradient:#ffa500:#ff8c00>Lösche:</gradient> <white>Lösche Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient>...</white>"
  delete_success: "<gradient:#32cd32:#228b22>Gelöscht:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> wurde gelöscht.</white>"
  delete_failed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> konnte nicht gelöscht werden.</white>"

  teleporting: "<gradient:#ffa500:#ff8c00>Teleportiere:</gradient> <white>Teleportiere zu <gradient:#ff7f50:#ff4500>{world_name}</gradient>...</white>"
  teleported: "<gradient:#32cd32:#228b22>Teleportiert:</gradient> <white>Du bist jetzt in <gradient:#ff7f50:#ff4500>{world_name}</gradient>.</white>"
  world_not_loaded: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist nicht geladen.</white>"

  already_loaded: "<gradient:#ffa500:#ff8c00>Info:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist bereits geladen.</white>"
  loading_world: "<gradient:#ffa500:#ff8c00>Lade:</gradient> <white>Lade Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient>...</white>"
  load_success: "<gradient:#32cd32:#228b22>Geladen:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> geladen.</white>"
  load_failed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> konnte nicht geladen werden.</white>"
  unload:
    not_loaded: "<gradient:#ffa500:#ff8c00>Info:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist nicht geladen.</white>"
    success: "<gradient:#32cd32:#228b22>Entladen:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> wurde entladen. Dateien und Einstellungen bleiben erhalten.</white>"
    failed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> konnte nicht entladen werden.</white>"
  reset:
    confirm_required: "<gradient:#dc143c:#b22222>Achtung:</gradient> <white>Ein Reset von <gradient:#ff7f50:#ff4500>{world_name}</gradient> zerstört jeden Block darin. Einstellungen bleiben erhalten, das Terrain nicht. Führe <gradient:#ffa500:#ff8c00>/mv reset {world_name} confirm</gradient> aus, um fortzufahren.</white>"
    started: "<gradient:#ffa500:#ff8c00>Reset:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> wird neu generiert. Spieler in dieser Welt werden zum Spawn bewegt.</white>"
    completed: "<gradient:#32cd32:#228b22>Reset:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> wurde neu generiert.</white>"
    failed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Reset der Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> fehlgeschlagen. Siehe Konsole.</white>"
  clone:
    started: "<gradient:#ffa500:#ff8c00>Klonen:</gradient> <white><gradient:#ff7f50:#ff4500>{source}</gradient> wird nach <gradient:#ff7f50:#ff4500>{target}</gradient> kopiert. Bei großen Welten dauert das einen Moment.</white>"
    completed: "<gradient:#32cd32:#228b22>Geklont:</gradient> <white><gradient:#ff7f50:#ff4500>{source}</gradient> wurde nach <gradient:#ff7f50:#ff4500>{target}</gradient> kopiert.</white>"
    failed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Klonen von <gradient:#ff7f50:#ff4500>{source}</gradient> nach <gradient:#ff7f50:#ff4500>{target}</gradient> fehlgeschlagen. Siehe Konsole.</white>"
    target_exists: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Eine Welt namens <gradient:#ff7f50:#ff4500>{target}</gradient> existiert bereits.</white>"
    plots_not_copied: "<gradient:#ffa500:#ff8c00>Hinweis:</gradient> <white>Plot-Ansprüche wurden nicht kopiert - <gradient:#ff7f50:#ff4500>{target}</gradient> startet unbeansprucht.</white>"

  list_empty: "<gray>Keine verwalteten Welten gefunden.</gray>"
  list_header: "<gradient:#ff7f50:#ff4500>Verwaltete Welten</gradient> <dark_gray>({count})</dark_gray>"
  list_entry: " <gray>-</gray> <gradient:#ffa500:#ff6347>{world_name}</gradient> <dark_gray>[{type} / {environment}]</dark_gray> <gray>{status}</gray> <dark_gray>global:</dark_gray> <gray>{global_spawn}</gray>"
  list_footer: "<dark_gray>{count}/{max} Welten</dark_gray>"

  help_header: "<gradient:#ff7f50:#ff4500>Multiverse Befehle</gradient>"
  help_create: "<gradient:#ffa500:#ff6347>/{alias} create <name> [env] [typ]</gradient> <gray>- Neue Welt erstellen</gray>"
  help_delete: "<gradient:#ffa500:#ff6347>/{alias} delete <welt></gradient> <gray>- Welt löschen</gray>"
  help_edit: "<gradient:#ffa500:#ff6347>/{alias} edit <welt></gradient> <gray>- Welt-Einstellungen bearbeiten</gray>"
  help_teleport: "<gradient:#ffa500:#ff6347>/{alias} teleport <welt></gradient> <gray>- Zu einer Welt teleportieren</gray>"
  help_load: "<gradient:#ffa500:#ff6347>/{alias} load <welt></gradient> <gray>- Welt aus der Datenbank laden</gray>"
  help_unload: "<gradient:#ffa500:#ff6347>/{alias} unload <welt> [save]</gradient> <gray>- Welt entladen, ohne sie zu löschen</gray>"
  help_reset: "<gradient:#ffa500:#ff6347>/{alias} reset <welt> confirm</gradient> <gray>- Terrain neu generieren, Einstellungen behalten</gray>"
  help_clone: "<gradient:#ffa500:#ff6347>/{alias} clone <welt> <ziel></gradient> <gray>- Welt unter neuem Namen kopieren</gray>"
  help_list: "<gradient:#ffa500:#ff6347>/{alias} list</gradient> <gray>- Alle Welten auflisten</gray>"
  help_footer: "<dark_gray>───────────────────────────────</dark_gray>"

  applyschematic_not_plot: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white><gradient:#ff7f50:#ff4500>{world_name}</gradient> ist keine PLOT-Welt.</white>"
  applyschematic_missing_name: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white><gradient:#ff7f50:#ff4500>{world_name}</gradient> hat kein Schematic konfiguriert. Übergib einen Namen als zweites Argument.</white>"
  applyschematic_not_found: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Schematic <gradient:#ff7f50:#ff4500>{schematic}</gradient> wurde in plugins/JExMultiverse/schematics/ nicht gefunden.</white>"
  applyschematic_done: "<gradient:#32cd32:#228b22>Angewendet:</gradient> <white><gradient:#ff7f50:#ff4500>{schematic}</gradient> auf <gradient:#ff7f50:#ff4500>{count}</gradient> Plot(s) in <gradient:#ff7f50:#ff4500>{world_name}</gradient> gepastet ({chunks} Chunks gescannt).</white>"
  applyschematic_done_single: "<gradient:#32cd32:#228b22>Angewendet:</gradient> <white><gradient:#ff7f50:#ff4500>{schematic}</gradient> einmalig am Spawn <gradient:#ff7f50:#ff4500>{x}/{y}/{z}</gradient> in <gradient:#ff7f50:#ff4500>{world_name}</gradient> gepastet.</white>"
  paste_player_only: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Nur Spieler können Schematics einfügen.</white>"
  paste_started: "<gradient:#ffa500:#ff8c00>Platziere:</gradient> <white><gradient:#ff7f50:#ff4500>{schematic}</gradient> wird eingefügt - kann einen Moment dauern…</white>"
  paste_done: "<gradient:#32cd32:#228b22>Eingefügt:</gradient> <white><gradient:#ff7f50:#ff4500>{schematic}</gradient> ({width}x{height}x{length}) bei <gradient:#ff7f50:#ff4500>{x}, {y}, {z}</gradient> in <gradient:#ff7f50:#ff4500>{world_name}</gradient>.</white>"
  paste_spawn_set: "<gradient:#32cd32:#228b22>Spawn:</gradient> <white>Spawn von <gradient:#ff7f50:#ff4500>{world_name}</gradient> auf den Einfügepunkt gesetzt.</white>"
  edit:
    wand_given: "<gradient:#32cd32:#228b22>Werkzeug:</gradient> <white>Linksklick auf einen Block = Ecke 1, Rechtsklick = Ecke 2.</white>"
    pos1_set: "<gradient:#32cd32:#228b22>Ecke 1:</gradient> <white><gradient:#ff7f50:#ff4500>{x}, {y}, {z}</gradient> <gray>({count} Blöcke ausgewählt)</gray></white>"
    pos2_set: "<gradient:#32cd32:#228b22>Ecke 2:</gradient> <white><gradient:#ff7f50:#ff4500>{x}, {y}, {z}</gradient> <gray>({count} Blöcke ausgewählt)</gray></white>"
    no_selection: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Setze zuerst beide Ecken - <gradient:#ff7f50:#ff4500>/mv wand</gradient> oder <gradient:#ff7f50:#ff4500>/mv pos1</gradient> & <gradient:#ff7f50:#ff4500>/mv pos2</gradient>.</white>"
    wrong_world: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Deine Auswahl liegt in einer anderen Welt.</white>"
    no_clipboard: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Deine Zwischenablage ist leer - nutze zuerst <gradient:#ff7f50:#ff4500>/mv copy</gradient>.</white>"
    working: "<gradient:#ffd700:#ffa500>Arbeite:</gradient> <white>Verarbeite <gradient:#ff7f50:#ff4500>{count}</gradient> Blöcke…</white>"
    selection_shown: "<gradient:#2dd4bf:#a855f7>Auswahl-Umriss:</gradient> <white>angezeigt - die Partikelbox umrandet deine pos1↔pos2-Region.</white>"
    selection_hidden: "<gradient:#2dd4bf:#a855f7>Auswahl-Umriss:</gradient> <white>ausgeblendet.</white>"
    set_done: "<gradient:#32cd32:#228b22>Gefüllt:</gradient> <white><gradient:#ff7f50:#ff4500>{count}</gradient> Blöcke auf <gradient:#ff7f50:#ff4500>{material}</gradient> gesetzt.</white>"
    bad_material: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Unbekannter Block <gradient:#ff7f50:#ff4500>{material}</gradient>.</white>"
    copy_done: "<gradient:#32cd32:#228b22>Kopiert:</gradient> <white><gradient:#ff7f50:#ff4500>{count}</gradient> Blöcke in die Zwischenablage.</white>"
    cut_done: "<gradient:#32cd32:#228b22>Ausgeschnitten:</gradient> <white><gradient:#ff7f50:#ff4500>{count}</gradient> Blöcke in die Zwischenablage verschoben.</white>"
    paste_done: "<gradient:#32cd32:#228b22>Eingefügt:</gradient> <white>Zwischenablage (<gradient:#ff7f50:#ff4500>{width}x{height}x{length}</gradient>) bei <gradient:#ff7f50:#ff4500>{x}, {y}, {z}</gradient>.</white>"
    save_done: "<gradient:#32cd32:#228b22>Gespeichert:</gradient> <white><gradient:#ff7f50:#ff4500>{schematic}</gradient> <gray>({count} Blöcke)</gray> → plugins/JExMultiverse/schematics/.</white>"
    save_failed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Konnte <gradient:#ff7f50:#ff4500>{schematic}</gradient> nicht speichern - siehe Konsole.</white>"
    save_progress: "<gradient:#2DD4BF:#6366F1>Speichere</gradient> <white><gradient:#ff7f50:#ff4500>{schematic}</gradient></white> <dark_gray>»</dark_gray> <#67E8F9>{percent}%</#67E8F9>"
    rotate_done: "<gradient:#32cd32:#228b22>Gedreht:</gradient> <white>Zwischenablage um <gradient:#ff7f50:#ff4500>{degrees}°</gradient> im Uhrzeigersinn gedreht.</white>"
    rotate_bad_arg: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Nutze <gradient:#ff7f50:#ff4500>90</gradient>, <gradient:#ff7f50:#ff4500>180</gradient> oder <gradient:#ff7f50:#ff4500>270</gradient>.</white>"
    flip_done: "<gradient:#32cd32:#228b22>Gespiegelt:</gradient> <white>Zwischenablage an der <gradient:#ff7f50:#ff4500>{axis}</gradient>-Achse gespiegelt.</white>"
    undo_done: "<gradient:#32cd32:#228b22>Rückgängig:</gradient> <white>Bereich des letzten Einfügens wiederhergestellt.</white>"
    undo_empty: "<gradient:#dc143c:#b22222>Nichts:</gradient> <white>Kein Einfügen zum Rückgängigmachen.</white>"
    undo_skipped: "<gradient:#f59e0b:#d97706>Achtung:</gradient> <white>Auswahl ist zu groß ({count} Blöcke) - Undo-Snapshot wird übersprungen, /mv undo wird die Aktion nicht wiederherstellen.</white>"

multiverse_editor_ui:
  title: "<gradient:#ff7f50:#ff4500>Welt bearbeiten</gradient> <dark_gray>({world_name})</dark_gray>"
  info:
    name: "<gradient:#ff7f50:#ff4500>{world_name}</gradient>"
    lore:
      - ""
      - "<gray>Typ:</gray> <gradient:#ffa500:#ff6347>{type}</gradient>"
      - "<gray>Umgebung:</gray> <gradient:#ffa500:#ff6347>{environment}</gradient>"
      - "<gray>Geladen:</gray> <gradient:#ffa500:#ff6347>{loaded}</gradient>"
      - "<gray>Verwaltete Gamerules:</gray> <gradient:#ffa500:#ff6347>{game_rules}</gradient>"
      - ""
      - "<gray>Änderungen werden erst beim Speichern</gray>"
      - "<gray>übernommen. Ausnahme: der globale Spawn</gray>"
      - "<gray>wirkt sofort.</gray>"
  keep_spawn:
    name: "<gradient:#ff7f50:#ff4500>Spawn geladen halten</gradient> <dark_gray>({value})</dark_gray>"
    lore:
      - ""
      - "<gray>Status:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Hält die Spawn-Chunks im Speicher.</gray>"
      - "<gray>Kostet RAM - nur sinnvoll bei Welten mit</gray>"
      - "<gray>Redstone oder Farmen am Spawn.</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Klicke</gradient> <gray>zum Umschalten</gray>"
    toggled: "<gradient:#32cd32:#228b22>Spawn-Chunks:</gradient> <white>Spawn-Chunks in <gradient:#ff7f50:#ff4500>{world_name}</gradient> sind jetzt <gradient:#ffa500:#ff6347>{value}</gradient>.</white>"
  time_lock:
    name: "<gradient:#ff7f50:#ff4500>Zeit fixieren</gradient> <dark_gray>({value})</dark_gray>"
    lore:
      - ""
      - "<gray>Fixiert auf:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Friert die Uhr auf der aktuellen Zeit ein</gray>"
      - "<gray>und hält sie über Neustarts hinweg.</gray>"
      - "<gray>Deaktiviert auch den Tag-Nacht-Zyklus.</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Klicke</gradient> <gray>zum Fixieren oder Lösen</gray>"
    toggled: "<gradient:#32cd32:#228b22>Zeit-Fixierung:</gradient> <white>Zeit in <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist jetzt <gradient:#ffa500:#ff6347>{value}</gradient>.</white>"
  weather_lock:
    name: "<gradient:#ff7f50:#ff4500>Wetter fixieren</gradient> <dark_gray>({value})</dark_gray>"
    lore:
      - ""
      - "<gray>Fixiert auf:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Hält das aktuelle Wetter und behält es</gray>"
      - "<gray>über Neustarts hinweg. Deaktiviert auch</gray>"
      - "<gray>den Wetterzyklus.</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Klicke</gradient> <gray>zum Fixieren oder Lösen</gray>"
    toggled: "<gradient:#32cd32:#228b22>Wetter-Fixierung:</gradient> <white>Wetter in <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist jetzt <gradient:#ffa500:#ff6347>{value}</gradient>.</white>"
  game_rules:
    name: "<gradient:#ff7f50:#ff4500>Gamerules</gradient> <dark_gray>({value} verwaltet)</dark_gray>"
    lore:
      - ""
      - "<gray>Verwaltet:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Weltspezifische Gamerules, werden bei</gray>"
      - "<gray>jedem Laden der Welt neu gesetzt.</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Klicke</gradient> <gray>zum Öffnen</gray>"
  not_loaded: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist nicht geladen, Live-Einstellungen können nicht geändert werden.</white>"
  spawn:
    name: "<gradient:#ff7f50:#ff4500>Spawnpunkt setzen</gradient>"
    lore:
      - ""
      - "<gray>Aktuell:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Klick</gradient> <gray>um Spawn auf deine Position zu setzen</gray>"
    updated: "<gradient:#32cd32:#228b22>Spawn aktualisiert:</gradient> <white>Spawn für <gradient:#ff7f50:#ff4500>{world_name}</gradient> auf deine Position gesetzt.</white>"
    wrong_world: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Du musst in <gradient:#ff7f50:#ff4500>{world_name}</gradient> sein, um deren Spawn zu setzen.</white>"
  global_spawn:
    name: "<gradient:#ff7f50:#ff4500>Globaler Spawn</gradient> <dark_gray>({value})</dark_gray>"
    lore:
      - ""
      - "<gray>Status:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Wenn aktiviert, spawnen alle</gray>"
      - "<gray>Spieler in dieser Welt.</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Klick</gradient> <gray>zum Umschalten</gray>"
    toggled: "<gradient:#32cd32:#228b22>Globaler Spawn:</gradient> <white><gradient:#ff7f50:#ff4500>{world_name}</gradient> ist jetzt <gradient:#ffa500:#ff6347>{value}</gradient>.</white>"
    replaced: "<gradient:#ffa500:#ff8c00>Globaler Spawn:</gradient> <white>Vorheriger globaler Spawn (<gradient:#ff7f50:#ff4500>{previous}</gradient>) durch <gradient:#ff7f50:#ff4500>{world_name}</gradient> ersetzt.</white>"
  pvp:
    name: "<gradient:#ff7f50:#ff4500>PvP-Schalter</gradient> <dark_gray>({value})</dark_gray>"
    lore:
      - ""
      - "<gray>Status:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Steuert ob Spieler sich</gray>"
      - "<gray>in dieser Welt bekämpfen können.</gray>"
      - ""
      - "<gradient:#ff7f50:#ff4500>Klick</gradient> <gray>zum Umschalten</gray>"
    toggled: "<gradient:#32cd32:#228b22>PvP:</gradient> <white>PvP in <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist jetzt <gradient:#ffa500:#ff6347>{value}</gradient>.</white>"
  time:
    name: "<gradient:#ff7f50:#ff4500>Tageszeit</gradient> <dark_gray>({value})</dark_gray>"
    lore:
      - ""
      - "<gray>Aktuell:</gray> <gradient:#ffa500:#ff6347>{value}</gradient>"
      - ""
      - "<gray>Wechselt Morgen → Mittag → Abend → Nacht.</gray>"
