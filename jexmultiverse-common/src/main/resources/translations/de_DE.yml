    pos2_set: "<gradient:#32cd32:#228b22>Ecke 2:</gradient> <white><gradient:#ff7f50:#ff4500>{x}, {y}, {z}</gradient> <gray>({count} Blöcke ausgewählt)</gray></white>"
    no_selection: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Setze zuerst beide Ecken - <gradient:#ff7f50:#ff4500>/mv wand</gradient> oder <gradient:#ff7f50:#ff4500>/mv pos1</gradient> & <gradient:#ff7f50:#ff4500>/mv pos2</gradient>.</white>"
    wrong_world: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Deine Auswahl liegt in einer anderen Welt.</white>"
