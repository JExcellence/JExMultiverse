prefix:
  - "<gradient:#ff7f50:#ff4500>Multiverse</gradient> <dark_gray>|</dark_gray> "

# Shared chrome-Fallbacks für BaseView / PaginatedView, wenn eine View ihre
# eigenen back/page-Keys weglässt. Ohne diese rendern die mv edit / gamerules
# GUIs die rohen i18n-Keys statt der Tile-Namen.
multiverse:
  invalid_environment: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Unbekannte Umgebung <gradient:#ff7f50:#ff4500>{environment}</gradient>. Erlaubt: NORMAL, NETHER, THE_END.</white>"
  invalid_type: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Unbekannter Welttyp <gradient:#ff7f50:#ff4500>{type}</gradient>. Erlaubt: DEFAULT, VOID, PLOT.</white>"
  type_not_available: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welttyp <gradient:#ff7f50:#ff4500>{type}</gradient> ist in dieser Edition nicht verfügbar.</white>"
  type_not_supported_on_platform: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welttyp <gradient:#ff7f50:#ff4500>{type}</gradient> kann auf Folia nicht erstellt werden. Folia erzeugt Welten über den NMS-Loader, der keine Generatoren unterstützt - die Welt würde als Void generiert werden. Nutze stattdessen DEFAULT oder VOID.</white>"
  world_limit_reached: "<gradient:#dc143c:#b22222>Limit erreicht:</gradient> <white>Maximale Welt-Anzahl erreicht (<gradient:#ff7f50:#ff4500>{max}</gradient>).</white>"
  world_does_not_exist: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> existiert nicht.</white>"
  world_already_exists: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> existiert bereits.</white>"

  # ── Build-Sperre / Baumodus ──
  lock_success: "<gradient:#32cd32:#228b22>Gesperrt:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist jetzt build-gesperrt. <gray>Nur Operatoren und /mv build können hier agieren.</gray></white>"
  unlock_success: "<gradient:#32cd32:#228b22>Entsperrt:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist nicht mehr build-gesperrt.</white>"
  lock_already: "<gradient:#ffa500:#ff8c00>Hinweis:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist bereits build-gesperrt.</white>"
  unlock_already: "<gradient:#ffa500:#ff8c00>Hinweis:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist nicht build-gesperrt.</white>"
  lock_failed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Die Build-Sperre für <gradient:#ff7f50:#ff4500>{world_name}</gradient> konnte nicht geändert werden.</white>"
  lock_not_managed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist keine verwaltete Multiverse-Welt.</white>"
  lock_needs_world: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Von der Konsole musst du eine Welt angeben: <gradient:#ff7f50:#ff4500>/mv lock <welt></gradient>.</white>"
  build_enabled: "<gradient:#32cd32:#228b22>Baumodus AN:</gradient> <white>Du kannst jetzt in build-gesperrten Welten bauen. <gray>Setzt sich beim Abmelden zurück.</gray></white>"
  build_disabled: "<gradient:#ffa500:#ff8c00>Baumodus AUS:</gradient> <white>Du umgehst build-gesperrte Welten nicht mehr.</white>"
  world_locked_denied: "<gradient:#dc143c:#b22222>Gesperrt:</gradient> <white>Diese Welt ist build-gesperrt. Nutze <gradient:#ff7f50:#ff4500>/mv build</gradient>, falls du im Team bist.</white>"

  creating_world: "<gradient:#ffa500:#ff8c00>Erstelle:</gradient> <white>Erstelle Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient>...</white>"
  create_success: "<gradient:#32cd32:#228b22>Erstellt:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> erstellt. <gray>(Typ: {type}, Env: {environment})</gray></white>"
  create_failed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> konnte nicht erstellt werden.</white>"
  import_already_managed: "<gradient:#ffa500:#ff8c00>Hinweis:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> wird bereits verwaltet.</white>"
  import_folder_not_found: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Kein Weltordner <gradient:#ff7f50:#ff4500>{world_name}</gradient> auf der Platte gefunden. Nutze /mv create für eine neue Welt.</white>"
  import_importing: "<gradient:#ffa500:#ff8c00>Importiere:</gradient> <white>Registriere existierende Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient>...</white>"
  import_success: "<gradient:#32cd32:#228b22>Importiert:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> registriert. <gray>(Typ: {type}, Umgebung: {environment})</gray></white>"
  import_failed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> konnte nicht importiert werden.</white>"

  deleting_world: "<gradient:#ffa500:#ff8c00>Lösche:</gradient> <white>Lösche Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient>...</white>"
  delete_success: "<gradient:#32cd32:#228b22>Gelöscht:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> wurde gelöscht.</white>"
  delete_failed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> konnte nicht gelöscht werden.</white>"

  teleporting: "<gradient:#ffa500:#ff8c00>Teleportiere:</gradient> <white>Teleportiere zu <gradient:#ff7f50:#ff4500>{world_name}</gradient>...</white>"
  teleported: "<gradient:#32cd32:#228b22>Teleportiert:</gradient> <white>Du bist jetzt in <gradient:#ff7f50:#ff4500>{world_name}</gradient>.</white>"
  world_not_loaded: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist nicht geladen.</white>"

  already_loaded: "<gradient:#ffa500:#ff8c00>Info:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> ist bereits geladen.</white>"
  loading_world: "<gradient:#ffa500:#ff8c00>Lade:</gradient> <white>Lade Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient>...</white>"
  load_success: "<gradient:#32cd32:#228b22>Geladen:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> geladen.</white>"
  load_failed: "<gradient:#dc143c:#b22222>Fehler:</gradient> <white>Welt <gradient:#ff7f50:#ff4500>{world_name}</gradient> konnte nicht geladen werden.</white>"
